# ============================================================================
# Weekly Health Check
# ============================================================================
# This workflow runs automated health checks on the project to ensure
# everything is working correctly. It monitors file integrity, code stats,
# and Python compatibility.
#
# Triggers:
#   - Every Sunday at 00:00 UTC (cron schedule)
#   - Manual trigger via workflow_dispatch
#
# Outputs:
#   - Health report in GitHub Actions summary
#   - File integrity verification
#   - Code statistics (lines of code)
#   - Python compatibility check
# ============================================================================

name: Weekly Health Check

# Workflow triggers
on:
  schedule:
    # Cron syntax: minute hour day month weekday
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  # ==========================================================================
  # Job: Project Health Check
  # ==========================================================================
  # Runs comprehensive health checks on the project
  health-check:
    name: Project Health Check
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup Python for compatibility testing
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'  # Test with Python 3.9

    # ==========================================================================
    # Python Compatibility Check
    # ==========================================================================
    # Verify the game works with Python 3.9
    - name: Check Python version compatibility
      run: |
        echo "Testing Python 3.9 compatibility"
        python3 --version

        # Quick smoke test: import and initialize game
        python3 -c "from cli.paperballs import Paperballs; g = Paperballs(5); print('✓ Python 3.9 compatible')"

    # ==========================================================================
    # File Integrity Check
    # ==========================================================================
    # Verify all critical files exist
    - name: Verify file integrity
      run: |
        # Start file integrity section in summary
        echo "## File Integrity Check" >> $GITHUB_STEP_SUMMARY

        # List of critical files that must exist
        files=(
          "README.md"
          "RULES.md"
          "CLAUDE.md"
          "LICENSE"
          "cli/paperballs.py"
          "web/index.html"
          "web/js/game.js"
          "web/js/ui.js"
          "web/js/main.js"
        )

        # Check each file and report status
        all_good=true
        for file in "${files[@]}"; do
          if [ -f "$file" ]; then
            echo "✓ $file" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ $file missing!" >> $GITHUB_STEP_SUMMARY
            all_good=false
          fi
        done

        # Summary result
        if [ "$all_good" = true ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All critical files present ✓" >> $GITHUB_STEP_SUMMARY
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Some files are missing!" >> $GITHUB_STEP_SUMMARY
          exit 1  # Fail the workflow if files are missing
        fi

    # ==========================================================================
    # Code Statistics
    # ==========================================================================
    # Count lines of code across all languages
    - name: Count lines of code
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Code Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Count Python lines (excluding .git directory)
        python_lines=$(find . -name "*.py" ! -path "./.git/*" -exec wc -l {} + | tail -1 | awk '{print $1}')

        # Count JavaScript lines
        js_lines=$(find . -name "*.js" ! -path "./.git/*" -exec wc -l {} + | tail -1 | awk '{print $1}')

        # Count HTML lines
        html_lines=$(find . -name "*.html" ! -path "./.git/*" -exec wc -l {} + | tail -1 | awk '{print $1}')

        # Count CSS lines
        css_lines=$(find . -name "*.css" ! -path "./.git/*" -exec wc -l {} + | tail -1 | awk '{print $1}')

        # Display statistics
        echo "- Python: ${python_lines} lines" >> $GITHUB_STEP_SUMMARY
        echo "- JavaScript: ${js_lines} lines" >> $GITHUB_STEP_SUMMARY
        echo "- HTML: ${html_lines} lines" >> $GITHUB_STEP_SUMMARY
        echo "- CSS: ${css_lines} lines" >> $GITHUB_STEP_SUMMARY

        # Calculate and display total
        total=$((python_lines + js_lines + html_lines + css_lines))
        echo "- **Total: ${total} lines**" >> $GITHUB_STEP_SUMMARY

    # ==========================================================================
    # Documentation Completeness Check
    # ==========================================================================
    # Verify documentation files have content
    - name: Check documentation completeness
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Documentation Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check line count for each documentation file
        for file in README.md RULES.md CLAUDE.md; do
          lines=$(wc -l < "$file")
          echo "- $file: $lines lines" >> $GITHUB_STEP_SUMMARY

          # Warn if documentation is too short
          if [ "$lines" -lt 50 ]; then
            echo "  ⚠️ This file seems short, may need more content" >> $GITHUB_STEP_SUMMARY
          fi
        done
